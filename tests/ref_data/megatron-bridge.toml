name = "megatron-bridge"
description = "Megatron-Bridge benchmark"
test_template_name = "MegatronBridge"
dse_excluded_args = []
extra_container_mounts = []
agent = "grid_search"
agent_steps = 1
agent_metrics = ["default"]
agent_reward_function = "inverse"

[[git_repos]]
url = "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
commit = "main"
init_submodules = false
mount_as = "/opt/Megatron-Bridge"

[cmd_args]
gpu_type = "gb200"
log_dir = ""
container_image = "__OUTPUT_DIR__/output/megatron_bridge_image.sqsh"
num_gpus = 16
enable_vboost = true
dryrun = false
enable_nsys = false
model_family_name = "qwen3"
model_recipe_name = "30b_a3b"
task = "pretrain"
compute_dtype = "bf16"
hf_token = "<REDACTED>"
evaluate = true
wandb_version = "0.28.1"
numpy_version = "1.26.4"
nemorun_version = "v0.10.0"
max_retries = 1
save_config_filepath = "/nemo_run/configs/ConfigContainer.yaml"
max_steps = 10

[extra_env_vars]
CUDA_VISIBLE_DEVICES = "0,1,2,3"
NCCL_DEBUG = "INFO"

[extra_cmd_args]
"--golden_values_path" = "/shared/references/qwen3.json"

[env_params]

[cmd_args.executor_env_vars]
NCCL_DEBUG = "WARN"
EXECUTOR_ONLY = "executor"
