name: Validate Fern Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fern/package-lock.json
      - name: Generate and validate documentation
        run: make -C doc check
      - name: Test reference generation
        run: uv run --locked --extra dev --extra docs pytest tests/doc/test_generate_reference.py
      - name: Upload Fern sources
        uses: actions/upload-artifact@v4
        with:
          name: cloudai-fern-docs
          path: |
            doc/**/*.mdx
            fern/docs.yml
            fern/fern.config.json
            fern/generated/
