name: Publish Documentation

on:
  push:
    branches: [main, 'release/**', '!release/docs']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: NVIDIA/cloudai/.github/workflows/docs-site.yml@main
    with:
      channel: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'dev' || 'release' }}
      source_ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
      release_tag: ${{ github.event.release.tag_name || '' }}
      preview_id: ${{ github.ref_name }}
      mode: ${{ (github.event_name == 'release' || github.ref_name == 'main') && 'production' || 'preview' }}
    secrets: inherit
