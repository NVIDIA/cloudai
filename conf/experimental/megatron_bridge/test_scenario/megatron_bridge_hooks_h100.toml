# H100 test with the MBridge v0.4.0 / NeMo 26.04 release pairing.
# Run with --hook-dir conf/hook. One case, one iteration, no training retries.
name = "megatron_bridge_hooks_h100"
pre_test = "nccl_test"
post_test = "nccl_test"

[[Tests]]
id = "mbridge-hooks"
path = "../test/h100/megatron_bridge_qwen_30b.toml"
num_nodes = 2
iterations = 1
time_limit = "00:30:00"
extra_srun_args = "--cpu-bind=none"

  [[Tests.git_repos]]
  url = "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
  commit = "v0.4.0"
  mount_as = "/opt/Megatron-Bridge"
  init_submodules = true

  [Tests.cmd_args]
  container_image = "nvcr.io#nvidia/nemo:26.04.00"
  nemorun_version = "v0.9.0"
  max_retries = 0

    [Tests.cmd_args.executor_env_vars]
    CLOUDAI_ENV_PRIORITY = "executor"
    CLOUDAI_EXECUTOR_ONLY = "executor-value"

  [Tests.extra_cmd_args]
  "--dump_env" = ""

  [Tests.extra_env_vars]
  PYTHONPATH = "/opt/Megatron-Bridge/3rdparty/Megatron-LM:${PYTHONPATH}"
  CLOUDAI_ENV_PRIORITY = "test"
  CLOUDAI_TEST_ONLY = "test-value"
