# Pair this scenario with a Slurm system configuration containing:
# hf_local_home_path = "/raid/cloudai"

name = "dynamo-vllm-qwen-0.6b-local-hf"
job_status_check = false

[[Tests]]
id = "dynamo.vllm.qwen-0.6b.local-hf"
test_name = "vLLM"
num_nodes = 1
time_limit = "00:10:00"

  [Tests.cmd_args]

    [Tests.cmd_args.dynamo]
    model = "Qwen/Qwen3-0.6B"

      [Tests.cmd_args.dynamo.prefill_worker]
      num-nodes = 1

        [Tests.cmd_args.dynamo.prefill_worker.args]
        tensor-parallel-size = 1
        pipeline-parallel-size = 1

      [Tests.cmd_args.dynamo.decode_worker]
      num-nodes = 1

        [Tests.cmd_args.dynamo.decode_worker.args]
        tensor-parallel-size = 1
        pipeline-parallel-size = 1

    [[Tests.cmd_args.aiperf_phases]]
    name = "local_hf_smoke"

      [Tests.cmd_args.aiperf_phases.args]
      concurrency = 2
      request-count = 10
      server-metrics = "auto"
