name = "agentx-dse"

[[Tests]]
id = "agentx"
name = "qwen_agentx"
description = "Two-step AgentX DSE correctness smoke test"
test_template_name = "SRTSlurm"
hf_models = [
  { model_name = "Qwen/Qwen3-0.6B", revision = "c1899de289a04d12100db370d81485cdf75e47ca" },
]
agent = "grid_search"
agent_steps = 2
agent_metrics = ["p90_intvty"]
agent_reward_function = "identity"

  [[Tests.git_repos]]
  url = "https://github.com/NVIDIA/srt-slurm.git"
  commit = "098e15aca8504d4747c6f62c7a845e178b7f4b10"

  [[Tests.git_repos]]
  url = "https://github.com/SemiAnalysisAI/InferenceX.git"
  commit = "f8dff19a6898e3ee0dd95232f867151d4d2d6392"
  init_submodules = true

  [Tests.cmd_args]
  recipe_path = "/shared/cloudai/example/recipe.yaml"
  cluster_config = "/shared/cloudai/example/srtslurm.yaml"
  result_format = "agentx"

    [Tests.cmd_args.recipe_overrides.roles.agg.args]
    context-length = [2048, 4096]

  [Tests.extra_env_vars]

  # Keep host-side uv work off shared home storage.
  UV_CACHE_DIR = "/tmp/cloudai-agentx-uv-cache"
  UV_PYTHON_INSTALL_DIR = "/tmp/cloudai-agentx-python"
