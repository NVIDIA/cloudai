name = "srt_slurm"

[[Tests]]
id = "srt.sglang"
# Benchmark node allocation is defined by recipe.yaml, not this value.
num_nodes = 1

name = "srt_sglang"
description = "SGLang through an existing srt-slurm recipe"
test_template_name = "SRTSlurm"
agent = "grid_search"
agent_metrics = ["tput_per_gpu"]

  [[Tests.git_repos]]
  url = "https://github.com/NVIDIA/srt-slurm.git"
  commit = "v2.2.1"

  [Tests.cmd_args]
  recipe_path = "conf/experimental/srt_slurm/recipe.yaml"
  # Owns benchmark scheduling defaults; CloudAI allocation settings are not merged.
  cluster_config = "conf/experimental/srt_slurm/srtslurm.yaml"
  result_format = "sa-bench"

    [Tests.cmd_args.recipe_overrides.benchmark]
    concurrencies = ["1", "4", "16"]
