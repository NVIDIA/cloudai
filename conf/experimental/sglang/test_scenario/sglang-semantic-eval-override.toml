# Evaluate 20 examples instead of 200 while inheriting the entrypoint and all
# other test settings from the referenced SGLang test.
name = "sglang-semantic-eval-override"

[[Tests]]
id = "sglang.semantic-eval.20-examples"
path = "../test/sglang.toml"
num_nodes = 1
time_limit = "00:10:00"

  [Tests.semantic_eval_cmd_args]
  cli = "--host {host} --port {port} --eval-name gsm8k --num-examples 20 --num-threads 128 --model {model}"
