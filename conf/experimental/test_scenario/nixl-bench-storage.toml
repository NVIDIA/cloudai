name = "nixl-bench-storage"

[[Tests]]
id = "nixl-bench-storage.posix.null-runtime"
num_nodes = 1
time_limit = "00:05:00"
test_name = "nixl-bench-posix"
description = "NIXLBench POSIX smoke test without ETCD"

  [Tests.cmd_args]
  etcd_endpoints = ""

[[Tests]]
id = "nixl-bench-storage.posix.etcd"
num_nodes = 1
time_limit = "00:05:00"
test_name = "nixl-bench-posix"
description = "NIXLBench POSIX smoke test with managed ETCD"

[[Tests]]
id = "nixl-bench-storage.posix.independent.4nodes.4threads"
num_nodes = 4
time_limit = "00:05:00"
path = "../test/nixl-bench-posix.toml"
description = "Independent NIXLBench POSIX processes, one per node, with 4 threads"
extra_srun_args = "--ntasks=4 --ntasks-per-node=1"

  [Tests.cmd_args]
  etcd_endpoints = ""
  num_threads = 4
  start_block_size = 1048576
  max_block_size = 1048576

[[Tests]]
id = "nixl-bench-storage.posix.independent.4nodes.8threads"
num_nodes = 4
time_limit = "00:05:00"
path = "../test/nixl-bench-posix.toml"
description = "Independent NIXLBench POSIX processes, one per node, with 8 threads"
extra_srun_args = "--ntasks=4 --ntasks-per-node=1"

  [Tests.cmd_args]
  etcd_endpoints = ""
  num_threads = 8
  start_block_size = 1048576
  max_block_size = 1048576
